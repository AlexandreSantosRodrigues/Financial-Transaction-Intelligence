name: Notebook static checks

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  notebook-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install notebook validator
        run: python -m pip install 'nbformat>=5.9,<6'
      - name: Validate notebook structure and Python syntax
        run: python -m unittest discover -s tests -v
