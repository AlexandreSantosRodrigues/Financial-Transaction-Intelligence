<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" role="img" aria-label="Anomalias mensais | Isolation Forest"><rect width="1280" height="680" fill="#f7f9fc"/><rect x="18" y="18" width="1244" height="644" rx="22" fill="#ffffff" stroke="#dce5f0"/><rect x="18" y="18" width="1244" height="9" rx="5" fill="#186a8b"/><text x="58" y="78" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#152b45" text-anchor="start">Anomalias mensais | Isolation Forest</text><text x="58" y="113" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#53667f" text-anchor="start">Dois meses atípicos no período de avaliação; janeiro de 2024 incompleto foi excluído.</text><text x="70" y="165" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#23334d" text-anchor="start">Meses sinalizados na janela de avaliação posterior à calibração</text><rect x="72" y="214" width="552" height="299" rx="18" fill="#f7fbfd" stroke="#e0e8f0"/><text x="98" y="260" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#23334d" text-anchor="start">Dezembro de 2022</text><text x="98" y="316" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#176c98" text-anchor="start">₹ 268,67 milhões</text><text x="98" y="357" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#23334d" text-anchor="start">Volume bruto de movimentações</text><rect x="98" y="391" width="485" height="31" rx="8" fill="#e4edf5" stroke="none"/><rect x="98" y="391" width="434.35468333333336" height="31" rx="8" fill="#176c98" stroke="none"/><text x="98" y="470" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#23334d" text-anchor="start">Score Isolation Forest: −0,018289</text><rect x="655" y="214" width="552" height="299" rx="18" fill="#f7fbfd" stroke="#e0e8f0"/><text x="681" y="260" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#23334d" text-anchor="start">Agosto de 2023</text><text x="681" y="316" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#dc8747" text-anchor="start">₹ 234,88 milhões</text><text x="681" y="357" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#23334d" text-anchor="start">Volume bruto de movimentações</text><rect x="681" y="391" width="485" height="31" rx="8" fill="#e4edf5" stroke="none"/><rect x="681" y="391" width="379.72654666666665" height="31" rx="8" fill="#dc8747" stroke="none"/><text x="681" y="470" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#23334d" text-anchor="start">Score Isolation Forest: −0,001517</text><text x="72" y="551" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#243b57" text-anchor="start">Os sinais são desvios estatísticos; não confirmam fraude ou falha operacional.</text><text x="58" y="639" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#566983" text-anchor="start">O modelo foi calibrado em uma série curta e requer comparação com baselines sazonais.</text></svg>