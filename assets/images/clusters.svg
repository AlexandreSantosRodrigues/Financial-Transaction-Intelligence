<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" role="img" aria-label="Segmentação de clientes | K-Means"><rect width="1280" height="680" fill="#f7f9fc"/><rect x="18" y="18" width="1244" height="644" rx="22" fill="#ffffff" stroke="#dce5f0"/><rect x="18" y="18" width="1244" height="9" rx="5" fill="#186a8b"/><text x="58" y="78" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#152b45" text-anchor="start">Segmentação de clientes | K-Means</text><text x="58" y="113" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#53667f" text-anchor="start">Dois grupos descritivos com diferenças em ticket, volume e recência; clusters não são previsões.</text><text x="62" y="182" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#23334d" text-anchor="start">Participação do volume financeiro total</text><rect x="62" y="210" width="1150" height="70" rx="8" fill="#e5edf4" stroke="none"/><rect x="62" y="210" width="1078.0878161672667" height="70" rx="8" fill="#176c98" stroke="none"/><text x="601.0439080836334" y="254" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle">93.75%</text><text x="1176.0439080836334" y="254" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#23415b" text-anchor="middle">6.25%</text><rect x="62" y="314" width="561" height="242" rx="14" fill="#f7fafe" stroke="#e0e8f1"/><rect x="82" y="337" width="12" height="186" rx="5" fill="#176c98" stroke="none"/><text x="115" y="361" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#23334d" text-anchor="start">Cluster 0</text><text x="115" y="413" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1c344f" text-anchor="start">51.617 clientes</text><text x="115" y="462" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23334d" text-anchor="start">Ticket mediano: ₹ 19.609,51</text><text x="115" y="494" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23334d" text-anchor="start">Recência mediana: 151 dias</text><text x="115" y="526" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23334d" text-anchor="start">Volume somado: ₹ 14,14 bi</text><rect x="646" y="314" width="561" height="242" rx="14" fill="#f7fafe" stroke="#e0e8f1"/><rect x="666" y="337" width="12" height="186" rx="5" fill="#22a6ad" stroke="none"/><text x="699" y="361" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#23334d" text-anchor="start">Cluster 1</text><text x="699" y="413" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1c344f" text-anchor="start">28.249 clientes</text><text x="699" y="462" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23334d" text-anchor="start">Ticket mediano: ₹ 3.399,45</text><text x="699" y="494" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23334d" text-anchor="start">Recência mediana: 352 dias</text><text x="699" y="526" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23334d" text-anchor="start">Volume somado: ₹ 0,94 bi</text><text x="58" y="639" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#566983" text-anchor="start">A estabilidade dos clusters e o Silhouette Score ainda precisam de validação.</text></svg>